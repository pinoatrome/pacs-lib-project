[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacs"
version = "0.1.0"
description = "Build and parse ISO 20022 pacs (payments clearing and settlement) XML: pacs.002, pacs.004, pacs.008 and pacs.028"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "lxml>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["pacs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
